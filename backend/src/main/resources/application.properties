spring.application.name=chordify-backend
server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/chordify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT (secret minimal 32 karakter; ganti lewat env JWT_SECRET) ----
app.jwt.secret=${JWT_SECRET:chordify-dev-secret-change-me-chordify-dev-secret}
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Dev server bisa diakses lewat localhost maupun 127.0.0.1 — keduanya harus diizinkan.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ---- Akun admin awal (dibuat otomatis jika belum ada admin) ----
app.admin.email=${ADMIN_EMAIL:admin@chordify.local}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin12345!}

# ---- Data contoh (seeder akun) ----
# Set SEED_ENABLED=false supaya tidak ada akun contoh di server produksi.
app.seed.enabled=${SEED_ENABLED:true}
# Password bersama untuk semua akun member contoh.
app.seed.password=${SEED_PASSWORD:Chordify123!}
